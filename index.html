<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Распознавание цифр (MNIST)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        /* Контейнер, чтобы выстроить холсты в один ряд */
        .canvas-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        #paintCanvas {
            border: 2px solid #333;
            background-color: black;
            cursor: crosshair;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        /* Обертка для маленького холста и его подписи */
        .small-canvas-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Наш новый холст для визуализации */
        #networkInputCanvas {
            border: 1px solid #999;
            background-color: black;
            width: 112px;  /* Визуально увеличиваем в 4 раза (28 * 4) */
            height: 112px;
            image-rendering: pixelated; /* Показываем четкие пиксели */
        }
        .small-canvas-wrapper span {
            font-size: 12px;
            color: #555;
            margin-top: 8px;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #ff4757;
            color: white;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #ff6b81;
        }
        #predictionText {
            margin-top: 20px;
            font-size: 24px;
            color: #2f3542;
        }
    </style>
</head>
<body>

    <h1>Нарисуй цифру от 0 до 9</h1>
    
    <div class="canvas-container">
        <!-- Наш большой холст для рисования -->
        <canvas id="paintCanvas" width="200" height="200"></canvas>
        
        <!-- Новый холст для того, что видит нейросеть -->
        <div class="small-canvas-wrapper">
            <canvas id="networkInputCanvas" width="28" height="28"></canvas>
            <span>Взгляд сети (28x28)</span>
        </div>
    </div>
    
    <div class="controls">
        <button id="clearBtn">Очистить холст</button>
    </div>
    
    <h2 id="predictionText">Предсказание: ?</h2>

    <script src="app.js"></script>

</body>
</html>
